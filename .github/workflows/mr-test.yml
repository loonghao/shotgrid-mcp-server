name: MR Checks
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'images/**'
      - '.github/workflows/docs.yml'

jobs:
  python-check:
    strategy:
      max-parallel: 3
      matrix:
        target:
          - os: 'ubuntu-latest'
            triple: 'x86_64-unknown-linux-gnu'
          - os: 'macos-latest'
            triple: 'x86_64-apple-darwin'
          - os: 'windows-latest'
            triple: 'x86_64-pc-windows-msvc'
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Test lanes are a subset of the matrix: every OS runs pytest on the
        # lowest and highest supported Python version, so Windows and macOS
        # have real CI evidence without paying for 15 full test runs.
        run-tests: [false]
        include:
          - { target: { os: 'ubuntu-latest', triple: 'x86_64-unknown-linux-gnu' }, python-version: "3.10", run-tests: true }
          - { target: { os: 'ubuntu-latest', triple: 'x86_64-unknown-linux-gnu' }, python-version: "3.14", run-tests: true }
          - { target: { os: 'macos-latest', triple: 'x86_64-apple-darwin' }, python-version: "3.10", run-tests: true }
          - { target: { os: 'macos-latest', triple: 'x86_64-apple-darwin' }, python-version: "3.14", run-tests: true }
          - { target: { os: 'windows-latest', triple: 'x86_64-pc-windows-msvc' }, python-version: "3.10", run-tests: true }
          - { target: { os: 'windows-latest', triple: 'x86_64-pc-windows-msvc' }, python-version: "3.14", run-tests: true }
      fail-fast: false
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup vx
        uses: loonghao/vx@vx-v0.6.13
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup development environment
        run: vx setup
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - name: lint
        run: vx just lint
      - name: test
        if: matrix.run-tests
        run: vx just test

  skills-extension:
    # Wire-level contract check: starts the real server and drives it with raw
    # JSON-RPC, which is the only check that sees the serialized field names.
    name: skills extension (wire-level)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup vx
        uses: loonghao/vx@vx-v0.6.13
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup development environment
        run: vx setup
      - name: Verify the Skills extension contract
        run: vx just verify-skills
