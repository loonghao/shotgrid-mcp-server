[project]
name = "shotgrid-mcp-server"
version = "0.15.4"
description = "ShotGrid MCP Server — expose ShotGrid (Flow Production Tracking) capabilities as MCP skills via dcc-mcp-core"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dcc-mcp-core>=0.17.54,<1.0.0",
    "uvicorn[standard]>=0.35.0",
    "starlette>=0.35.0",
    "pydantic[email]>=2.0.0",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.1.0",
    "aiohttp>=3.12.14",  # Fix CVE-2025-53643
    "requests>=2.32.4",  # Fix CVE-2024-47081
    "shotgun-api3>=3.8.2",
    "shotgrid-query>=0.1.0",
    "python-slugify (>=8.0.4,<9.0.0)",
    "pendulum (>=3.1.0,<4.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "click>=8.0.0",
    "websockets>=15.0.1",
    "diskcache_rs>=0.4.4",
]
authors = [
    { name = "Hal Long", email = "hal.long@outlook.com" },
]
license = { text = "MIT" }
keywords = ["shotgrid", "mcp", "server", "api", "Flow Production Tracking", "dcc-mcp-core", "skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/loonghao/shotgrid-mcp-server"
Repository = "https://github.com/loonghao/shotgrid-mcp-server.git"
Issues = "https://github.com/loonghao/shotgrid-mcp-server/issues"
Changelog = "https://github.com/loonghao/shotgrid-mcp-server/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "PyYAML",
]
lint = [
    "ruff",
    "black",
    "mypy",
    "types-requests",
]
dev = [
    "black>=23.12.1",
    "coverage>=7.4.0",
    "flake8>=7.0.0",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "nox>=2023.4.22",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.11",
    "uv>=0.9.6",  # Fix CVE-2025-62727, CVE-2025-54368, and other ZIP parsing vulnerabilities
]

[project.scripts]
shotgrid-mcp-server = "shotgrid_mcp_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotgrid_mcp_server"]
include = [
    "src/shotgrid_mcp_server/**/*.py",
    "skills/**/*.md",
    "skills/**/*.yaml",
    "skills/**/*.yml",
    "skills/**/*.py",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.nox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
atomic = true
include_trailing_comma = true
lines_after_imports = 2
lines_between_types = 1
use_parentheses = true
src_paths = ["shotgrid_mcp_server", "tests"]
filter_files = true
known_first_party = "shotgrid_mcp_server"

# Enforce import section headers.
import_heading_future = "Import future modules"
import_heading_stdlib = "Import built-in modules"
import_heading_thirdparty = "Import third-party modules"
import_heading_firstparty = "Import local modules"

force_sort_within_sections = true
force_single_line = true

# All project unrelated unknown imports belong to third-party.
default_section = "THIRDPARTY"
skip_glob = []

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "skills"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = ["E501", "PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"noxfile.py" = ["E402", "I001"]
"tests/*" = ["S101"]

[tool.coverage.run]
source = ["shotgrid_mcp_server"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=shotgrid_mcp_server --cov-report=term-missing"

[tool.uvx.python]
version = "3.10"

[tool.uv]
python-preference = "only-managed"
